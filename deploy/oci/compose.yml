# MySQL 8 + Redis. 둘 다 127.0.0.1에만 publish한다 (외부 노출 금지).
# 값은 같은 폴더의 .env에서 읽는다 (setup-server.sh가 만든다).
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: teenymoney
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+09:00
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysql:/var/lib/mysql]
  redis:
    image: redis:7
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis:/data]
volumes: { mysql: {}, redis: {} }
